services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rns_db
      POSTGRES_USER: rns_user
      POSTGRES_PASSWORD: rns_strong_password
    volumes:
      - rns_pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+asyncpg://rns_user:rns_strong_password@db:5432/rns_db
      ADMIN_API_KEY: rns-admin-secret-2026
      CORS_ORIGINS: '["http://localhost:8001","http://127.0.0.1:8001"]'
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    command: gunicorn --chdir src app.main:application --bind 0.0.0.0:8001 --workers 3
    environment:
      BACKEND_API_URL: http://backend:8000/api/v1
      FRONTEND_DEBUG: "False"
    ports:
      - "8001:8001"
    depends_on:
      - backend

volumes:
  rns_pgdata:
